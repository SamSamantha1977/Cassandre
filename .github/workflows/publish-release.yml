name: Publish Worker bootstrap
on:
  push:
    branches: [main]
    paths:
      - "Releases/**"
      - "README.md"
      - "install-user.py"
      - "INSTALL-CASS-Win.cmd"
      - "setup_windows.cs"
      - "build-setup-windows.ps1"
      - "setup_windows.exe"
      - "INSTALL-CASS-Mac.command"
      - "INSTALL-CASS-Lin.sh"
      - "install-windows.ps1"
      - "install-linux.sh"
      - "install-macos.sh"
      - "packaging/**"
      - ".github/workflows/publish-release.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-windows-setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build setup_windows.exe
        shell: powershell
        run: .\build-setup-windows.ps1
      - name: Upload Windows setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: cassandra-windows-setup
          path: setup_windows.exe
          if-no-files-found: error

  release:
    needs: build-windows-setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Windows setup artifact
        uses: actions/download-artifact@v4
        with:
          name: cassandra-windows-setup
          path: .

      - name: Build native Linux installer packages
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby-full rpm
          sudo gem install --no-document fpm
          chmod +x packaging/linux/build-native-packages.sh
          packaging/linux/build-native-packages.sh

      - name: Build self-contained macOS runtime
        shell: bash
        run: python3 packaging/macos/build_cass_macos.py

      - name: Build no-Terminal macOS app installer
        shell: bash
        run: python3 packaging/macos/build_cass_macos_app.py

      - name: Verify macOS installer end-to-end
        shell: bash
        run: python3 packaging/macos/verify_cass_macos.py

      - name: Enforce zero-window policy
        shell: bash
        run: python3 packaging/verify_zero_window_policy.py

      - name: Refresh SHA256SUMS
        shell: bash
        run: |
          {
            cd Releases
            sha256sum \
              M3DIA-Worker-Windows.zip \
              M3DIA-Worker-Linux.tar.gz \
              M3DIA-Worker-macOS.zip \
              M3DIA-Worker.deb \
              M3DIA-Worker.rpm \
              Cass-MacOs.zip
            cd ..
            sha256sum setup_windows.exe INSTALL-CASS-Win.cmd INSTALL-CASS-Lin.sh
          } | sed 's#  Releases/#  #' > Releases/SHA256SUMS.txt

      - name: Publish or update stable Worker release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: worker-bootstrap
          name: Cassandre Worker bootstrap
          make_latest: true
          prerelease: false
          overwrite_files: true
          body: |
            Cassandre est un reseau communautaire gratuit de partage de ressources informatiques.
            Installation du WORKER dans le compte utilisateur, sans droits administrateur local.

            Windows : INSTALL-CASS-Win.cmd
            macOS : INSTALL-CASS-Mac.command
            Linux : INSTALL-CASS-Lin.sh

            Configuration : https://cassandre.infos.st/planning

            Les archives techniques restent accessibles automatiquement aux installateurs,
            mais ne sont pas proposees en telechargement manuel dans cette Release.
          files: |
            INSTALL-CASS-Win.cmd
            INSTALL-CASS-Mac.command
            INSTALL-CASS-Lin.sh
            Releases/SHA256SUMS.txt

      - name: Masquer les anciennes pieces jointes techniques et administrateur
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/cassandre-release-cleanup.cmtrace.log"
          cmtrace() {
            printf '<![LOG[%s]LOG]!><time="%s" date="%s" component="ReleaseCleanup" context="" type="%s" thread="0" file="">\n' "$1" "$(date '+%H:%M:%S.000')" "$(date '+%m-%d-%Y')" "$2" >> "$LOG"
          }
          cmtrace "Verification des assets publics Cassandre." 1
          for required in INSTALL-CASS-Win.cmd INSTALL-CASS-Mac.command INSTALL-CASS-Lin.sh Releases/SHA256SUMS.txt; do
            if [ "$required" = "Releases/SHA256SUMS.txt" ]; then required="SHA256SUMS.txt"; fi
            if ! gh release view worker-bootstrap --json assets --jq '.assets[].name' -R "$GITHUB_REPOSITORY" | grep -Fxq "$required"; then
              cmtrace "Asset public absent: $required" 3
              exit 1
            fi
          done
          while IFS= read -r asset; do
            case "$asset" in
              *M3DIA*|setup_windows.exe|Cass-MacOs.zip)
                cmtrace "Suppression de la piece jointe obsolete: $asset" 1
                gh release delete-asset worker-bootstrap "$asset" --yes -R "$GITHUB_REPOSITORY"
                ;;
            esac
          done < <(gh release view worker-bootstrap --json assets --jq '.assets[].name' -R "$GITHUB_REPOSITORY")
          if gh release view worker-bootstrap --json assets --jq '.assets[].name' -R "$GITHUB_REPOSITORY" | grep -E 'M3DIA|^(setup_windows.exe|Cass-MacOs.zip)$'; then
            cmtrace "Des assets techniques ou administrateur subsistent dans la Release." 3
            exit 1
          fi
          cmtrace "Release publique nettoyee et controlee." 1

      - name: Archiver le journal CMTrace de la publication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cassandre-release-cleanup-cmtrace
          path: ${{ runner.temp }}/cassandre-release-cleanup.cmtrace.log
          if-no-files-found: warn
